# Io: loopbacks for the speaker and headphone sinks too, as on SteamOS 3.8.4
# (a deviation from 3.9.2). Valve's steamdeck-dsp 0.91 (on SteamOS 3.8.4)
# marks Audio/Sink and Audio/Source in alsa-loopback.conf; 1.02 (on 3.9.2,
# and what Io builds) marks only Audio/Source. This adds the sink rule back; WirePlumber appends it to
# Valve's rules. The loopback keeps applications from seeing the speaker
# rebuilt, e.g. when Steam's Mono audio changes its channel count.
monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Sink"
        alsa.loopback = "!\"true\""
      }
    ]
    actions = {
      update-props = {
        node.create-loopback = true
      }
    }
  }
]
