# Io: Galileo (Steam Deck OLED) headphones, the rule of Valve's Galileo
# alsa-card1.conf (steamdeck-dsp 1.03, hardware-profiles/valve-galileo)
# that Jupiter's has for its own card: the headphone output suspends only
# after 15 minutes of silence, against the clicks and pops of powering up
# and down. Jupiter's alsa-card1.conf, installed as it is, carries the same
# rule for acp5x; this one matches sof-nau8821-max only.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        alsa.card_name = "sof-nau8821-max"
        device.profile.description = "Headphones"
      }
    ]
    actions = {
      update-props = {
        # Prevent sleeping for 15 min to reduce power up/down clicks
        session.suspend-timeout-seconds = 900
      }
    }
  }
]
