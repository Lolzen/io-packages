# Valve's UCM profile for the Deck's card (conf.d/acp5x/acp5x.conf from this
# package) only takes effect without Void's alsa-ucm-conf link
# conf.d/acp5x/Valve-Jupiter-1.conf: UCM looks for the card's long name
# (Valve-Jupiter-1) before the driver name, so that link wins and the Deck
# runs upstream's profile ("Mic", no headphone sink) instead of Valve's
# ("Internal Mic", headphones) as on SteamOS 3.8.4.
noextract=/usr/share/alsa/ucm2/conf.d/acp5x/Valve-Jupiter-1.conf
