# Microphone loopback for the Steam Deck (Jupiter), rebuilding what Valve's
# patched WirePlumber does on SteamOS.
#
# On SteamOS, the ALSA mic source carries node.create-loopback = true and
# Valve's WirePlumber (CreateLoopback() in its alsa.lua - a Valve patch, not
# upstream code, absent from upstream 0.5.14 and 0.5.17 alike) turns that
# into a libpipewire-module-loopback pair. Io runs Void's upstream
# WirePlumber, so the loopback is declared here with the same properties.
#
# audio.channels / audio.position are essential: without them the loopback
# source has no fixed format while suspended, PipeWire's pulse layer reports
# it as "source not ready: sample:0 map:0", and Steam drops it from its
# microphone list.
#
# Node names follow Valve's scheme: alsa_loopback_stream.<hw node> for the
# capture side, alsa_loopback_device.<hw node> for the source Steam sees,
# which carries the hardware's own description, as on SteamOS. (The hw node
# is HiFi__Mic__source here; newer alsa-ucm-conf renamed it from SteamOS's
# HiFi__Internal_Mic__source.)
#
# target.delay.sec: the capture side must not try to bind before WirePlumber
# has created the ALSA mic node at session start, or it binds nothing and
# never retries.
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "ACP/ACP3X/ACP6x Audio Coprocessor Internal Microphone"
            target.delay.sec = 3
            capture.props = {
                node.name          = "alsa_loopback_stream.alsa_input.pci-0000_04_00.5-platform-acp5x_mach.0.HiFi__Mic__source"
                node.description   = "ALSA internal stream for ACP/ACP3X/ACP6x Audio Coprocessor Internal Microphone"
                media.class        = "Stream/Input/Audio"
                audio.channels     = 2
                audio.position     = [ FL FR ]
                alsa.loopback      = true
                node.passive       = true
                node.dont-fallback = true
                node.linger        = true
                target.object      = "alsa_input.pci-0000_04_00.5-platform-acp5x_mach.0.HiFi__Mic__source"
            }
            playback.props = {
                node.name        = "alsa_loopback_device.alsa_input.pci-0000_04_00.5-platform-acp5x_mach.0.HiFi__Mic__source"
                node.description = "ACP/ACP3X/ACP6x Audio Coprocessor Internal Microphone"
                node.virtual     = false
                media.class      = "Audio/Source"
                audio.channels   = 2
                audio.position   = [ FL FR ]
                alsa.loopback    = true
                priority.session = 2001
                session.suspend-timeout-seconds = 0
            }
        }
    }
]
