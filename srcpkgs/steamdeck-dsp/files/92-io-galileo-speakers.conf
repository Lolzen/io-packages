# Io: Galileo (Steam Deck OLED) speaker DSP, the part of Valve's Galileo
# alsa-card1.conf (steamdeck-dsp 1.02, hardware-profiles/valve-galileo) that
# Jupiter's lacks: WirePlumber puts Valve's speaker plugin in front of the
# OLED's speaker sink. The rule matches sof-nau8821-max only, so it does
# nothing on Jupiter (acp5x).
node.filter-graph.rules = [
  {
    matches = [
      {
        media.class = "Audio/Sink"
        alsa.card_name = "sof-nau8821-max"
        device.profile.description = "Speaker"
      }
    ]
    actions = {
      create-filter-graph = [
        {
          nodes = [
            {
              type = lv2,
              name = valve_deck_speakers,
              plugin = "https://faustlv2.bitbucket.io/valve_deck_speakers",
              label = valve_deck_speakers
            }
          ]
        }
      ]
    }
  }
]
