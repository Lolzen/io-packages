# Connectivity check, as on SteamOS: tells "connected" from "connected, but
# no internet" and detects captive portals (hotel or train Wi-Fi). SteamOS
# uses Arch's endpoint; Io uses the one GNOME runs for NetworkManager, which
# answers with exactly the text NetworkManager expects by default.
[connectivity]
uri=http://nmcheck.gnome.org/check_network_status.txt
