hostonly=no
# dracut loads these one after another, in this order. The SD card modules go
# first: detecting the card takes about a second and runs in the background
# while amdgpu loads (which alone takes ~4 s). The other way round, the card
# was only looked for once amdgpu had finished.
force_drivers+=" sdhci sdhci_pci mmc_block amdgpu "
# Boot splash: plymouthd starts in the initramfs and keeps the screen until
# SDDM's service hands it over (plymouth quit --retain-splash).
add_dracutmodules+=" plymouth "
# Valve's Deck modules from SteamOS's initramfs hook (mkinitcpio's
# steam-deck hook in steamos-customizations-jupiter), for both models: the
# Deck's own drivers (steamdeck MFD, hwmon, LEDs, extcon) and the USB
# dual-role stack, which Valve adds "for full USB on galileo units". dracut's
# generic set on x86 has xhci but leaves dwc3, extcon and the MFD out (it
# adds those on ARM only). Included, and loaded only where they match.
add_drivers+=" xhci_plat_hcd dwc3 dwc3_pci roles ulpi udc_core xhci_pci_renesas uas steamdeck steamdeck_hwmon leds_steamdeck extcon_steamdeck "
