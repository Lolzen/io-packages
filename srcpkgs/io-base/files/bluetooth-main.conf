# Io: BlueZ settings of SteamOS. Valve patches them into the main.conf of its
# bluez package (0001-valve-bluetooth-config.patch, bluez 5.87-2.4 on SteamOS
# 3.9.2): "Enable compatibility with devices like AirPods Pro", connect
# faster, and LE scanning that lets devices wake the Deck from suspend.
#
# bluetoothd reads this file instead of /etc/bluetooth/main.conf (OPTS in
# /etc/sv/bluetoothd/conf); every key not set here keeps BlueZ's default, as
# in Void's main.conf, where all keys are commented out. To go back to
# /etc/bluetooth/main.conf, empty OPTS there and restart bluetoothd.

[General]
MultiProfile = multiple
FastConnectable = true

[LE]
ScanIntervalSuspend=2240
ScanWindowSuspend=224
