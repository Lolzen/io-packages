repository=https://github.com/Lolzen/io-repo/releases/download/current

# elogind ships a runit service and a D-Bus activation file. With both, the
# one that loses the race at boot retries every second for good; Io starts
# elogind only as a runit service. mkimg.sh removes the file from the image,
# this keeps elogind updates from bringing it back.
noextract=/usr/share/dbus-1/system-services/org.freedesktop.login1.service
