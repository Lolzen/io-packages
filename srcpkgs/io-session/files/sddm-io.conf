# Io's SDDM defaults, installed under Valve's name
# /usr/lib/sddm/sddm.conf.d/holo.conf (holo-session-selection). Log deck in
# straight into game mode, and again whenever a session ends.
# steamos-manager (SessionManagement1) overrides the session in
# /etc/sddm.conf.d: zz-holo-autologin.conf for the default login mode,
# zzt-holo-temp-login.conf for one login (the zz-steamos-* names while a
# file of that name is there).
[General]
DisplayServer=wayland
# Valve's holo.conf (3.9.2) also sets InputMethod=qtvirtualkeyboard. That is
# SDDM's default, and SDDM 0.21 drops it for a Wayland greeter
# (GreeterApp.cpp: the compositor has to provide the input method), so the
# line would change nothing here.

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Autologin]
Relogin=true
Session=gamescope-wayland.desktop
User=deck

[Theme]
Current=breeze
