# Io's SDDM defaults (SteamOS: /usr/lib/sddm/sddm.conf.d/steamos.conf and
# /etc/sddm.conf.d/steamos.conf). Log deck in straight into game mode, and
# again whenever a session ends. io-steamos-manager (SessionManagement1)
# overrides the session in /etc/sddm.conf.d: zz-steamos-autologin.conf for
# the default login mode, zzt-steamos-temp-login.conf for one login.
[General]
DisplayServer=wayland
# Valve's holo.conf (3.9.2) also sets InputMethod=qtvirtualkeyboard. That is
# SDDM's default, and SDDM 0.21 drops it for a Wayland greeter
# (GreeterApp.cpp: the compositor has to provide the input method), so the
# line would change nothing here.

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Autologin]
Relogin=true
Session=gamescope-wayland.desktop
User=deck

[Theme]
Current=breeze
