# Io: as on SteamOS (jupiter-legacy-support), logging out ends every process
# of the session. With SDDM, a session switch is a logout; without this, the
# old session's D-Bus bus and everything started with setsid kept running -
# a whole Plasma, and a second io-steamos-manager on a dead bus, after each
# switch. Other sessions (SSH) are separate and not affected.
[Login]
KillUserProcesses=yes
