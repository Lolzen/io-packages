# Valve's NetworkManager defaults for the Deck (steamos-customizations
# jupiter-20260827.2), without dns=systemd-resolved (Io has no resolved).
# wpa_supplicant is the backend since Valve's change of 2026-08-27; iwd can
# be chosen with steamos-wifi-set-backend ("Force WPA Supplicant Wi-Fi
# backend" off in Steam's developer settings), which writes its override to
# /etc/NetworkManager/conf.d/99-valve-wifi-backend.conf.
[main]
iwd-config-path=auto

[device]
wifi.backend=wpa_supplicant
wifi.iwd.autoconnect=yes

[connection]
ipv6.ip6-privacy=2
