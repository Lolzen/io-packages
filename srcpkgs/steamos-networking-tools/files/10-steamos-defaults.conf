# Valve's NetworkManager defaults for the Deck (steamos-customizations):
# iwd as the Wi-Fi backend, with NetworkManager deciding when to connect.
# steamos-wifi-set-backend overrides the backend in
# /etc/NetworkManager/conf.d/99-valve-wifi-backend.conf.
[main]
iwd-config-path=auto

[device]
wifi.backend=iwd
wifi.iwd.autoconnect=no
