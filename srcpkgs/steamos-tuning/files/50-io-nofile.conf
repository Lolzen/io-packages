# Io: the open-file limit SteamOS inherits from systemd (DefaultLimitNOFILE
# 1024:524288; Steam's hard limit on SteamOS 3.9.2 is 524288). Without
# systemd a login gets the kernel's 1024:4096. Valve's game mode session
# raises its soft limit to 524288 (ulimit -n), which needs this hard limit.
*	soft	nofile	1024
*	hard	nofile	524288
