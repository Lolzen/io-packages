# Valve's Deck modules for the initramfs, from SteamOS's mkinitcpio hook
# "steam-deck" (steamos-customizations-jupiter), used on both models: the
# Deck's own drivers (steamdeck MFD, hwmon, LEDs, extcon) and the USB
# dual-role stack, which Valve adds "for full USB on galileo units".
# dracut's generic set on x86 has xhci but leaves dwc3, extcon and the MFD
# out (it adds those on ARM only). Included, and loaded only where they
# match. Io's own boot choices (SD card modules and amdgpu first, Plymouth)
# are in io-base's 10-io.conf.
add_drivers+=" xhci_plat_hcd dwc3 dwc3_pci roles ulpi udc_core xhci_pci_renesas uas steamdeck steamdeck_hwmon leds_steamdeck extcon_steamdeck "
