# Valve's sleep.conf.d/steamos-suspend-then-hibernate.conf (SteamOS 3.9.2,
# steamos-customizations-jupiter 20260827.2), for elogind. Left out:
# HibernateOnACPower=no (systemd 257; elogind 252 does not know it), so on
# AC power suspend-then-hibernate hibernates after the delay as well.
# Where Io may not hibernate, zz-io-hibernate.conf (61-io-hibernate-guard.sh)
# switches it off again.
[Sleep]
AllowHibernation=yes
AllowSuspendThenHibernate=yes

# TODO: This delay need to be changed possibly after the experimentation
# of battery based decision of hibernation
HibernateDelaySec=20min
