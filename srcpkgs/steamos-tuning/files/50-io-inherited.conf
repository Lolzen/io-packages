# Io: sysctls SteamOS does not set itself but inherits from Arch and systemd
# (values as captured on SteamOS 3.8.4 and 3.9.2). Void sets none of them, so
# without this file Io runs with the kernel's defaults. Same reasoning as
# 50-pid-max.conf.

# Arch's filesystem package (10-arch.conf): room for the many inotify
# watches of Steam, Proton and file managers.
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches = 524288

# systemd's 50-default.conf, in its own form: procps-ng 4 understands the
# globs and the "-" excludes (all.* keeps the kernel default, as on SteamOS).
kernel.sysrq = 16
fs.protected_regular = 1
fs.protected_fifos = 1
net.core.default_qdisc = fq_codel
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.*.rp_filter = 2
-net.ipv4.conf.all.rp_filter
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.*.accept_source_route = 0
-net.ipv4.conf.all.accept_source_route
net.ipv4.conf.default.promote_secondaries = 1
net.ipv4.conf.*.promote_secondaries = 1
-net.ipv4.conf.all.promote_secondaries
net.ipv4.ping_group_range = 0 2147483647

# systemd itself (PID 1) raises this at boot: the queue of datagram Unix
# sockets such as /dev/log, which the kernel's default of 10 lets overflow
# when many log messages arrive at once.
net.unix.max_dgram_qlen = 512
