<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  com.steampowered.Atomupd1, served by io-steamos-manager's root half (xbps
  behind it). Same ownership rule as Valve's atomupd-daemon policy. Valve
  lets anyone call it and checks polkit per method; Io limits callers to
  root and wheel, as for com.steampowered.SteamOSManager1.
-->
<busconfig>
  <policy user="root">
    <allow own="com.steampowered.Atomupd1"/>
    <allow send_destination="com.steampowered.Atomupd1"/>
  </policy>
  <policy group="wheel">
    <allow send_destination="com.steampowered.Atomupd1"/>
  </policy>
</busconfig>
