<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Root half of io-steamos-manager. Same ownership rule as Valve's policy.
  Valve lets any local user call it; Io limits callers to root and wheel,
  since the root daemon changes power limits and services.
-->
<busconfig>
  <policy user="root">
    <allow own="com.steampowered.SteamOSManager1"/>
    <allow send_destination="com.steampowered.SteamOSManager1"/>
  </policy>
  <policy group="wheel">
    <allow send_destination="com.steampowered.SteamOSManager1"/>
  </policy>
</busconfig>
