# system.conf - settings for mkrootfs.sh and mkimg.sh. Every value can be
# overridden from the environment (sudo SIZE=24G ./mkimg.sh).
#
# Paths are hardcoded to /home/gee instead of $HOME: sudo replaces $HOME
# with /root, which silently sends the results to the wrong place.

OUT="${OUT:-/home/gee/io.img}"
SIZE="${SIZE:-16G}"
MNT="${MNT:-/mnt/ioimg}"
WORKDIR="${WORKDIR:-/home/gee/io-build}"
SYS_ROOTFS="${SYS_ROOTFS:-$WORKDIR/io-rootfs}"
ROOTFS_TARBALL="${ROOTFS_TARBALL:-$WORKDIR/io-rootfs.tar.zst}"
# TRIM=1 shrinks io.img to its contents plus this margin. Until the user
# expands the storage (io-grow-storage, by hand), that margin is all the
# free space there is: Steam's first update alone needs hundreds of MB.
TRIM_MARGIN_MB="${TRIM_MARGIN_MB:-2048}"

IO_REPO="${IO_REPO:-https://github.com/Lolzen/io-repo/releases/download/current}"
VOID="${VOID:-https://repo-default.voidlinux.org/current}"

# deck is the default user, as on SteamOS. Another name also needs SDDM's
# autologin, the devkit service and Valve's automount script changed (see
# the wiki's Building page).
USERNAME="${USERNAME:-deck}"
USERPASS="${USERPASS:-deck}"
# Root stays usable for alpha testing. SteamOS locks it; Io does not, yet.
ROOTPASS="${ROOTPASS:-deck}"
# Not in gamemode, as on SteamOS: its @gamemode limit (nice -10 for soft and
# hard) would let Steam renice itself; Proton's nice comes from
# steamos-tuning's 15-proton-nice.conf.
USERGROUPS="wheel,audio,video,input,storage,socklog"
HOSTNAME="${HOSTNAME:-io}"
# UTC until the user picks a zone in Steam (steamos-set-timezone, via
# io-base's timedatectl).
TIMEZONE="${TIMEZONE:-UTC}"
LANG_DEFAULT="${LANG_DEFAULT:-en_US.UTF-8}"
ESP_LABEL="IOESP"
ROOT_LABEL="IOROOT"
BOOTLOADER_ID="Io"

# The locales SteamOS ships precompiled (holo-glibc-locales): every
# language and region Steam offers. Generated from Void's glibc-locales.
IO_LOCALES="bg_BG cs_CZ da_DK de_AT de_BE de_CH de_DE de_IT de_LI de_LU
 el_CY el_GR en_AG en_AU en_BW en_CA en_DK en_GB en_HK en_IE en_IL en_IN
 en_NG en_NZ en_PH en_SC en_SG en_US en_ZA en_ZM en_ZW es_AR es_BO es_CL
 es_CO es_CR es_CU es_DO es_EC es_ES es_GT es_HN es_MX es_NI es_PA es_PE
 es_PR es_PY es_SV es_US es_UY es_VE fi_FI fr_BE fr_CA fr_CH fr_FR fr_LU
 hu_HU it_CH it_IT ja_JP ko_KR nb_NO nl_AW nl_BE nl_NL pl_PL pt_BR pt_PT
 ro_RO ru_RU ru_UA sv_FI sv_SE th_TH tr_CY tr_TR uk_UA vi_VN zh_CN zh_HK
 zh_SG zh_TW"

# Kernel command line as on SteamOS 3.8.4 and 3.9.2 (captured, identical), minus what is
# systemd-, A/B- or SteamOS-specific (rd.systemd.gpt_auto, fsck.*,
# steamos.efi) and with two Io differences: fbcon=rotate:1 instead of
# fbcon=vc:4-6 (tty1 keeps a readable console for the fallback shell), and
# no console=tty1. net.ifnames=0 keeps kernel interface names (wlan0) as on
# SteamOS: iwd recreates the Wi-Fi interface under that name.
# amdgpu.gttsize is gone: SteamOS sizes GTT through ttm.pages_min instead.
# It is written into the root's /etc/default/grub by mkrootfs.sh, so an
# installation from the recovery image gets it too.
KCMD_LOG="log_buf_len=4M loglevel=3 quiet splash plymouth.ignore-serial-consoles"
KCMD_GPU1="amd_iommu=off amdgpu.lockup_timeout=5000,10000,10000,5000"
KCMD_GPU2="ttm.pages_min=2097152 amdgpu.sched_hw_submission=4 amdgpu.dcdebugmask=0x20000"
KCMD_MISC="audit=0 rd.luks=0 rd.lvm=0 rd.md=0 rd.dm=0 fbcon=rotate:1 net.ifnames=0"
KERNEL_CMDLINE="$KCMD_LOG $KCMD_GPU1 $KCMD_GPU2 $KCMD_MISC"

# tty1 is a plain login console: SDDM runs the sessions on tty7.
SERVICES="NetworkManager bluetoothd chronyd dbus earlyoom elogind sshd udevd socklog-unix nanoklogd holo-zram-swap jupiter-fan-control io-steamos-manager vpower steam-web-debug-portforward jupiter-firewall gpu-trace io-sddm agetty-tty1 agetty-tty2 agetty-tty3 agetty-tty4 agetty-tty5 agetty-tty6"
