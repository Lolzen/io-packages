# recovery.conf - settings for mkrecovery.sh. Every value can be
# overridden from the environment (REC_* names).
#
# The recovery system only has to boot to a desktop from which the install
# scripts run. Passwords are known on purpose: locking anyone out of a
# recovery system defeats its purpose.

WORKDIR="${WORKDIR:-/home/gee/io-build}"
OUT="${REC_OUT:-$WORKDIR/recovery.img}"
# auto: recovery system + payload + margin, rounded up.
SIZE="${REC_SIZE:-auto}"
MNT="${REC_MNT:-/mnt/iorecovery}"
REC_ROOTFS="${REC_ROOTFS:-$WORKDIR/recovery-rootfs}"
SYS_ROOTFS="${SYS_ROOTFS:-$WORKDIR/io-rootfs}"
ROOTFS_TARBALL="${ROOTFS_TARBALL:-$WORKDIR/io-rootfs.tar.zst}"
TRIM_MARGIN_MB="${REC_TRIM_MARGIN_MB:-256}"
IO_REPO="${IO_REPO:-https://github.com/Lolzen/io-repo/releases/download/current}"
VOID="${VOID:-https://repo-default.voidlinux.org/current}"
HOSTNAME="${REC_HOSTNAME:-iorecovery}"
TIMEZONE="${REC_TIMEZONE:-UTC}"
LANG_DEFAULT="${REC_LANG:-en_US.UTF-8}"
REC_USER="${REC_USER:-iorecovery}"
REC_USERPASS="${REC_USERPASS:-deck}"
REC_ROOTPASS="${REC_ROOTPASS:-deck}"
REC_GROUPS="wheel,audio,video,input,storage"
# Labels of its own, so the recovery stick cannot be mistaken for an Io
# card or installation.
ESP_LABEL="IORECESP"
REC_LABEL="IOREC"
BOOTLOADER_ID="IoRecovery"
PAYLOAD_PATH="recovery/io-rootfs.tar.zst"
# Io's kernel command line without the splash: the same hardware needs the
# same amdgpu and IOMMU settings (see system.conf).
KERNEL_CMDLINE="log_buf_len=4M loglevel=3 amd_iommu=off amdgpu.lockup_timeout=5000,10000,10000,5000 ttm.pages_min=2097152 amdgpu.sched_hw_submission=4 amdgpu.dcdebugmask=0x20000 audit=0 rd.luks=0 rd.lvm=0 rd.md=0 rd.dm=0 fbcon=rotate:1 net.ifnames=0"
# Optional, for testing: a Wi-Fi network the recovery system joins on its
# own: sudo REC_WIFI_SSID=... REC_WIFI_PSK=... ./mkrecovery.sh --clean
# Empty by default. The password ends up in the image in plain text, and a
# reused recovery rootfs keeps it: build with --clean to drop it again.
REC_WIFI_SSID="${REC_WIFI_SSID:-}"
REC_WIFI_PSK="${REC_WIFI_PSK:-}"
# sshd and a syslog, so a recovery system that does not come up can be
# looked at from another machine (iorecovery / deck).
# io-recovery-sddm instead of Void's sddm service, see mkrecovery.sh.
SERVICES="NetworkManager dbus elogind udevd io-recovery-sddm agetty-tty1 agetty-tty2 sshd socklog-unix nanoklogd"
